<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio & Links</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="tree-container">
    <header class="profile-section">
      <div class="avatar-frame">
        <img id="profile-img" src="avatar.jpg" alt="Foto de perfil" class="avatar-img" />
        <div id="avatar-fallback" class="avatar-fallback" aria-hidden="true">✦</div>
      </div>
      <h1 id="profile-name" class="profile-name">Aethel</h1>
      <p id="profile-bio" class="profile-bio">Projetos, ensaios & criações</p>
    </header>

    <nav aria-label="Lista de projetos" class="links-nav">
      <ul id="links-list" class="links-list">
        <!-- Renderizado dinamicamente via script.js -->
      </ul>
    </nav>

    <footer class="tree-footer">
      <span class="footer-glyph">✦</span>
    </footer>
  </main>
</body>
</html>
